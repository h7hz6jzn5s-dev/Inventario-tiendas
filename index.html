let current=null, stream=null, detector=null;
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function lookup(){
 let c=$("code").value.trim();
 if(!c){$("result").innerHTML='<div class="notfound"><span class="warn">Escribe o escanea un código.</span></div>';return}
 current=map[c]||null;
 if(current){
   $("result").innerHTML='<div class="found"><span class="ok">✓ Producto encontrado</span><div class="name">'+esc(current.desc)+'</div><div class="muted">SKU: '+esc(current.sku)+' · Código: '+esc(c)+'</div></div>';
   $("qtyArea").classList.remove("hidden"); $("qty").value=(counts[current.sku]??1); $("qty").focus(); $("qty").select();
 }else{
   $("result").innerHTML='<div class="notfound"><span class="warn">⚠ Código no encontrado</span><div class="muted">Código: '+esc(c)+'</div></div>';
   $("qtyArea").classList.add("hidden"); current=null;
 }
}
$("search").onclick=lookup;
$("code").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();lookup()}});
$("save").onclick=()=>{
 if(!current)return;
 let q=parseInt($("qty").value,10); if(!Number.isFinite(q)||q<0)q=0;
 counts[current.sku]=q; localStorage.setItem("odm_counts",JSON.stringify(counts)); render();
 $("code").value="";$("result").innerHTML="";$("qtyArea").classList.add("hidden");current=null;$("code").focus();
};
function render(){
 let es=Object.entries(counts);$("items").textContent=es.length+" productos";
 $("units").textContent=es.reduce((a,[,q])=>a+Number(q||0),0)+" piezas";
 $("rows").innerHTML=es.map(([sku,q])=>{
  let p=CAT.find(x=>x.sku===sku)||{desc:""};
  return '<tr><td>'+esc(sku)+'</td><td>'+esc(p.desc)+'</td><td><b>'+q+'</b></td><td><button class="edit alt" onclick="editSku('+JSON.stringify(sku)+')">Editar</button></td></tr>';
 }).join("");
}
window.editSku=sku=>{let p=CAT.find(x=>x.sku===sku);if(!p)return;current=p;$("code").value=p.ean||p.gtin||p.sku;lookup()};
$("clear").onclick=()=>{if(confirm("¿Borrar el conteo de esta demo?")){counts={};localStorage.removeItem("odm_counts");render()}};
$("export").onclick=()=>{
 let st=$("store").value;if(!st){alert("Selecciona la tienda.");return}
 let d=$("date").value;let rows=[["Tienda","SKU","Descripción","Inventario","Fecha"]];
 CAT.forEach(p=>rows.push([st,p.sku,p.desc,counts[p.sku]??0,d]));
 let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(",")).join("\n");
 let blob=new Blob(["\\ufeff"+csv],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="Inventario_"+st+"_"+d+".csv";a.click();
};
$("cam").onclick=async()=>{
 if(!navigator.mediaDevices?.getUserMedia){alert("El navegador no permite usar la cámara en esta página.");return}

  $("camArea").classList.remove("hidden");stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
  $("video").srcObject=stream;await $("video").play();detector=new BarcodeDetector({formats:["ean_13","ean_8","code_128","upc_a","upc_e"]});

};
async function scanLoop(){
 if(!stream)return;
 try{let cs=await detector.detect($("video"));if(cs.length){$("code").value=cs[0].rawValue;lookup();stopCam();return}}catch(e){}

}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$("camArea").classList.add("hidden")}
$("stop").onclick=stopCam;
